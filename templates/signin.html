{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block body %}
<main class="pico container">
    <header>
        <h1>signin</h1>
        <button @click="dark != dark" x-text="dark ? 'Light' : 'Dark'"></button>
    </header>
    <form method="post">
        <label>user name</label>
        <input type="text" id="user_name" name="user_name">

        <label>password</label>
        <input type="password" id="password_hash" name="password_hash">

        <img src="{{ url_for('captcha.get_captcha') }}">
        <label>captcha</label>
        <input type="text" name="captcha">

        <button type="submit">signin</button>
        <p class="secondary">don't have an account? <a href="{{ url_for('login.signup') }}">signup</a></p>
    </form>

</main>

{% endblock %}
